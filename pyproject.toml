[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "senku-quantumflow"
version = "1.2.0"
authors = [
  { name="Senku Technologies", email="labs@senku.tech" }
]
description = "SENKU // QuantumFlow: 10 Billion Percent Resilient Multiverse Execution & Counterfactual Causality Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.scripts]
senku = "senku:main"

[project.urls]
"Homepage" = "https://github.com/senkutech/quantumflow"
"Bug Tracker" = "https://github.com/senkutech/quantumflow/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumflow"
version = "1.0.0"
authors = [
  { name="Principal Software Engineer" }
]
description = "Speculative Multiverse Execution Runtime & Counterfactual Causality Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
"Homepage" = "https://github.com/quantumflow/quantumflow"
"Bug Tracker" = "https://github.com/quantumflow/quantumflow/issues"
